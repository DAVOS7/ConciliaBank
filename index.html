<style>

<script>
"use strict";

/* ================= CONSTANTES ================= */
var CTA_555 = "55500000";
var CTA_BANCO_DEF = "57200000";
var DEFAULT_CLIENT_ID = "16873040089-t63ama0nha38jr7oonlebhcfrhrcf00a.apps.googleusercontent.com";
var CONFIG_FILENAME = "config_conciliabanco.json";
var LS_CONFIG = "conciliabanco_config";
var LS_SESION = "conciliabanco_sesion";
var LS_FILEID = "conciliabanco_driveid";

/* ================= ESTADO ================= */
var S = {
  config: { empresas: [], ts: 0, clientId: DEFAULT_CLIENT_ID },
  screen: "empresas",              // empresas | trabajo
  empresaId: null,
  diarioName: "", bancoName: "", planDiario: {},
  facturas: [], movs: [], resultados: [],
  filtro: "TODOS", sel: {}, bulkCuenta: "",
  showDat: false,
  pendingBanco: null,              // filas del banco a la espera de mapeo manual
  drive: { ready: false, connected: false, token: null, fileId: null }
};

/* ================= UTILIDADES ================= */
function lsGet(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function norm(s){
  return String(s==null?"":s).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function money(n){ return new Intl.NumberFormat("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n); }
function fmtDate(d){
  if(d instanceof Date && !isNaN(d)) return d.toLocaleDateString("es-ES");
  var m=String(d==null?"":d).match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[3]+"/"+m[2]+"/"+m[1];
  return String(d==null?"":d);
}
function toTime(d){
  if(d instanceof Date) return d.getTime();
  var s=String(d==null?"":d);
  var m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1]).getTime();
  var t=Date.parse(s); return isNaN(t)?0:t;
}
function toYYYYMMDD(d){
  var dt = d instanceof Date ? d : new Date(d);
  if(isNaN(dt)){ var m=String(d).match(/(\d{2})\/(\d{2})\/(\d{4})/); if(m) return m[3]+m[2]+m[1]; return "00000000"; }
  return ""+dt.getFullYear()+String(dt.getMonth()+1).padStart(2,"0")+String(dt.getDate()).padStart(2,"0");
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function el(id){ return document.getElementById(id); }
function readWorkbook(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(e){ try{ res(XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true})); }catch(err){ rej(err); } };
    r.onerror=function(){ rej(new Error("No se pudo leer el archivo")); };
    r.readAsArrayBuffer(file);
  });
}
function rowsOf(ws){ return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}); }

/* ================= LECTORES ================= */
function parseDiario(wb){
  var facturas=[], plan={};
  wb.SheetNames.forEach(function(name){
    var rows=rowsOf(wb.Sheets[name]), h=-1;
    for(var i=0;i<Math.min(rows.length,20);i++){
      var line=(rows[i]||[]).map(norm);
      if(line.indexOf("CUENTA")>=0 && line.indexOf("CONCEPTO")>=0 && (line.indexOf("IMPORTE DEBE")>=0||line.indexOf("IMPORTE HABER")>=0)){ h=i; break; }
    }
    if(h<0) return;
    var H=rows[h].map(norm), c=function(n){return H.indexOf(n);};
    var ci={fecha:c("FECHA"),doc:c("DOCUMENTO"),cuenta:c("CUENTA"),desc:c("DESCRIPCION DE LA CUENTA"),debe:c("IMPORTE DEBE"),haber:c("IMPORTE HABER")};
    var fecha=null;
    for(var j=h+1;j<rows.length;j++){
      var r=rows[j]; if(!r) continue;
      if(r[ci.fecha]) fecha=r[ci.fecha];
      var cuenta=r[ci.cuenta]==null?"":String(r[ci.cuenta]).replace(/\.0$/,"").trim();
      if(!/^\d{6,8}/.test(cuenta)) continue;
      var c8=cuenta.padStart(8,"0").slice(0,8);
      if(/^(40|41|43)/.test(c8)){
        var nombre=String(r[ci.desc]==null?"":r[ci.desc]).trim();
        plan[c8]=nombre;
        var imp=Math.round(((+r[ci.debe]||0)+(+r[ci.haber]||0))*100)/100;
        if(imp>0) facturas.push({fecha:fecha,doc:String(r[ci.doc]==null?"":r[ci.doc]).trim(),cuenta:c8,nombre:nombre,importe:imp,tipo:c8.charAt(0)==="4"&&c8.charAt(1)==="3"?"COBRO":"PAGO"});
      }
    }
  });
  var seen={}, fac=[];
  facturas.forEach(function(f){ var k=f.doc+"|"+f.cuenta+"|"+f.importe; if(!seen[k]){ seen[k]=1; fac.push(f); } });
  return {facturas:fac, plan:plan};
}

// Devuelve {movs} o {needMap: {rows, header, hint}} si no reconoce columnas
function parseBancoAuto(wb, mapeo){
  for(var s=0;s<wb.SheetNames.length;s++){
    var rows=rowsOf(wb.Sheets[wb.SheetNames[s]]), h=-1;
    for(var i=0;i<Math.min(rows.length,25);i++){
      var line=(rows[i]||[]).map(norm);
      if(line.indexOf("CONCEPTO")>=0 && line.indexOf("IMPORTE")>=0){ h=i; break; }
    }
    if(h<0 && !mapeo) continue;
    if(mapeo){ return {movs: extractBanco(rows, mapeo.header, mapeo.cols)}; }
    var H=rows[h].map(norm);
    var idx=function(cs){ for(var k=0;k<cs.length;k++){ var p=H.indexOf(cs[k]); if(p>=0) return p; } return -1; };
    var cols={fecha:idx(["FECHA OPERACION","FECHA"]),concepto:idx(["CONCEPTO"]),importe:idx(["IMPORTE"]),codigo:idx(["CODIGO"])};
    if(cols.importe<0||cols.concepto<0) continue;
    return {movs: extractBanco(rows, h, cols), header:h, cols:cols};
  }
  // no reconocido: pedir mapeo manual con la primera hoja
  var rows0=rowsOf(wb.Sheets[wb.SheetNames[0]]);
  var hdr=0; // fila candidata a cabecera: la primera con >=3 celdas de texto
  for(var q=0;q<Math.min(rows0.length,15);q++){ var t=(rows0[q]||[]).filter(function(x){return String(x==null?"":x).trim().length>0;}); if(t.length>=3){ hdr=q; break; } }
  return {needMap:{rows:rows0, header:hdr}};
}
function extractBanco(rows, h, cols){
  var movs=[];
  for(var i=h+1;i<rows.length;i++){
    var r=rows[i]; if(!r||r[cols.importe]==null) continue;
    var raw=r[cols.importe], importe=typeof raw==="number"?raw:parseFloat(String(raw).replace(/\./g,"").replace(",","."));
    if(isNaN(importe)) continue;
    movs.push({fecha:r[cols.fecha],concepto:String(r[cols.concepto]==null?"":r[cols.concepto]).trim(),importe:importe,codigo:cols.codigo>=0&&r[cols.codigo]!=null?String(r[cols.codigo]).replace(/\.0$/,""):""});
  }
  return movs;
}

function parsePlan(wb){
  var plan={};
  wb.SheetNames.forEach(function(name){
    var rows=rowsOf(wb.Sheets[name]), h=-1,colCta=-1,colNom=-1;
    for(var i=0;i<Math.min(rows.length,25);i++){
      var line=(rows[i]||[]).map(norm);
      var cta=line.findIndex(function(x){return ["CUENTA","CODIGO","CODIGO CUENTA","CTA","SUBCUENTA"].indexOf(x)>=0;});
      var nom=line.findIndex(function(x){return ["DESCRIPCION","TITULO","NOMBRE","DENOMINACION","DESCRIPCION DE LA CUENTA","TITULO DE LA CUENTA"].indexOf(x)>=0;});
      if(cta>=0&&nom>=0){ h=i;colCta=cta;colNom=nom;break; }
    }
    var start=h>=0?h+1:0;
    for(var j=start;j<rows.length;j++){
      var r=rows[j]; if(!r) continue;
      var cuenta="",nombre="",ni=colNom;
      if(colCta>=0){ cuenta=String(r[colCta]==null?"":r[colCta]).replace(/\.0$/,"").trim(); }
      else { var k=r.findIndex(function(x){return /^\d{6,8}$/.test(String(x==null?"":x).replace(/\.0$/,"").trim());});
             if(k>=0){ cuenta=String(r[k]).replace(/\.0$/,"").trim(); if(ni<0){ ni=r.findIndex(function(x,jj){return jj!==k && String(x==null?"":x).trim().length>3;}); } } }
      if(ni>=0) nombre=String(r[ni]==null?"":r[ni]).trim();
      if(!/^\d{6,8}$/.test(cuenta)) continue;
      var c8=cuenta.padStart(8,"0").slice(0,8);
      if(/^(40|41|43)/.test(c8) && nombre) plan[c8]=nombre;
    }
  });
  return plan;
}

/* ================= MOTOR ================= */
function planActual(){
  var e=empresa(); var pe=(e&&e.plan)||{};
  var out={}; for(var k in S.planDiario) out[k]=S.planDiario[k]; for(var k2 in pe) out[k2]=pe[k2];
  return out;
}
function identificarTercero(concepto, tipo, planEntries){
  var cn=norm(concepto), best=null, bestScore=0;
  for(var i=0;i<planEntries.length;i++){
    var cta=planEntries[i][0], nombre=planEntries[i][1];
    if(tipo==="PAGO" && !/^(40|41)/.test(cta)) continue;
    if(tipo==="COBRO" && !/^43/.test(cta)) continue;
    var words=norm(nombre).split(" ").filter(function(w){return w.length>2;});
    if(!words.length) continue;
    var hits=words.filter(function(w){return cn.indexOf(w)>=0;}).length;
    var score=hits/words.length;
    if(hits>=1 && score>=0.5 && score>bestScore){ bestScore=score; best={cuenta:cta,nombre:nombre}; }
  }
  return best;
}
function buscarFacturas(cuenta, importe, tipo, fechaMov, facturas){
  var cand=facturas.filter(function(f){return f.cuenta===cuenta && f.tipo===tipo;});
  var exact=cand.filter(function(f){return Math.abs(f.importe-importe)<0.005;});
  if(exact.length===1) return {estado:"FACTURA",docs:[exact[0].doc]};
  if(exact.length>1){ // desempate por cercanía de fecha
    var mt=toTime(fechaMov);
    exact.sort(function(a,b){return Math.abs(toTime(a.fecha)-mt)-Math.abs(toTime(b.fecha)-mt);});
    return {estado:"FACTURA",docs:[exact[0].doc]};
  }
  var imps=cand.map(function(f){return f.importe;}), docs=cand.map(function(f){return f.doc;});
  for(var n=2;n<=3;n++){
    var hits=[];
    (function rec(start,acc,sum){
      if(acc.length===n){ if(Math.abs(sum-importe)<0.005) hits.push(acc.slice()); return; }
      for(var i=start;i<imps.length;i++) rec(i+1,acc.concat([i]),sum+imps[i]);
    })(0,[],0);
    if(cand.length>40) break;
    if(hits.length===1) return {estado:"COMBINACION",docs:hits[0].map(function(i){return docs[i];})};
    if(hits.length>1) break;
  }
  return {estado:null,docs:null};
}
function conciliar(){
  var plan=planActual(), planEntries=Object.keys(plan).map(function(k){return [k,plan[k]];});
  var fac=S.facturas;
  S.resultados = S.movs.map(function(m,i){
    var importe=Math.round(Math.abs(m.importe)*100)/100;
    var tipo=m.importe<0?"PAGO":"COBRO";
    var terc=identificarTercero(m.concepto,tipo,planEntries);
    var cuenta=CTA_555, estado="555", docs=null, nombre="Partidas pendientes aplicacion";
    if(terc){ cuenta=terc.cuenta; nombre=terc.nombre; var r=buscarFacturas(terc.cuenta,importe,tipo,m.fecha,fac); estado=r.estado||"TERCERO"; docs=r.docs; }
    return {id:i,fecha:m.fecha,concepto:m.concepto,importe:importe,tipo:tipo,cuenta:cuenta,nombre:nombre,estado:estado,docs:docs};
  });
  S.sel={}; S.showDat=false; S.filtro="TODOS";
}

/* ================= .DAT ================= */
function generarDAT(){
  var e=empresa(); var cfgEmp=(e&&e.codigoA3)||"", cfgBanco=(e&&e.ctaBanco)||CTA_BANCO_DEF;
  var NOM={}; NOM[CTA_555]="Partidas pendientes aplicacion"; NOM[cfgBanco]="Banco";
  function put(L,s,ini){ s=String(s); for(var i=0;i<s.length;i++) L[ini+i]=s[i]; }
  function linea(fecha,cuenta,desc,dh,nasi,concepto,importe){
    var L=new Array(254); for(var z=0;z<254;z++) L[z]=" ";
    put(L,cfgEmp,0);
    put(L,toYYYYMMDD(fecha),6);
    put(L,"0"+cuenta,14);
    put(L,String(desc).slice(0,30),27);
    put(L,dh,57);
    put(L,String(nasi).padStart(5,"0"),58);
    put(L,dh==="D"?"I":"U",68);
    put(L,String(concepto).slice(0,30),69);
    var cent=Math.round(importe*100);
    put(L,"+"+String(Math.floor(cent/100)).padStart(10,"0")+"."+String(cent%100).padStart(2,"0"),99);
    put(L,"EN",252);
    return L.join("");
  }
  var out=[];
  S.resultados.forEach(function(r,i){
    var n=i+1;
    var descT = r.cuenta===CTA_555 ? "Partidas pendientes aplicacion" : (r.nombre||r.concepto);
    if(r.tipo==="PAGO"){
      out.push(linea(r.fecha,r.cuenta,descT,"D",n,r.concepto,r.importe));
      out.push(linea(r.fecha,cfgBanco,"Banco","H",n,r.concepto,r.importe));
    } else {
      out.push(linea(r.fecha,cfgBanco,"Banco","D",n,r.concepto,r.importe));
      out.push(linea(r.fecha,r.cuenta,descT,"H",n,r.concepto,r.importe));
    }
  });
  return out.join("\r\n")+"\r\n";
}
function datName(){ var d=new Date(); return "SUENLACE_BANCO_"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+".DAT"; }
function downloadText(text, filename, mime){
  var bytes=new Uint8Array(text.length);
  for(var i=0;i<text.length;i++){ var c=text.charCodeAt(i); bytes[i]=c>255?63:c; }
  try{
    var url=URL.createObjectURL(new Blob([bytes],{type:mime||"application/octet-stream"}));
    var a=document.createElement("a"); a.href=url; a.download=filename; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1200);
    return true;
  }catch(e){ return false; }
}

/* ================= GOOGLE DRIVE ================= */
var tokenClient=null;
function driveInit(){
  if(!(window.google && google.accounts && google.accounts.oauth2)) return false;
  S.drive.ready=true;
  return true;
}
function driveConnect(){
  if(!driveInit()){ toast("Google aún no ha cargado. Reintenta en un momento."); return; }
  try{
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: S.config.clientId || DEFAULT_CLIENT_ID,
      scope: "https://www.googleapis.com/auth/drive.file",
      callback: function(resp){
        if(resp && resp.access_token){ S.drive.token=resp.access_token; S.drive.connected=true; render(); driveLoad(); }
        else { toast("No se pudo conectar con Google Drive."); }
      }
    });
    tokenClient.requestAccessToken({prompt:""});
  }catch(e){ toast("Error al iniciar sesión con Google."); }
}
function driveHeaders(){ return {Authorization:"Bearer "+S.drive.token}; }
function driveFindFile(){
  var q=encodeURIComponent("name='"+CONFIG_FILENAME+"' and trashed=false");
  return fetch("https://www.googleapis.com/drive/v3/files?q="+q+"&spaces=drive&fields=files(id,name,modifiedTime)",{headers:driveHeaders()})
    .then(function(r){return r.json();})
    .then(function(j){ return (j.files&&j.files[0])?j.files[0].id:null; });
}
function driveReadFile(id){
  return fetch("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media",{headers:driveHeaders()})
    .then(function(r){return r.json();});
}
function driveCreateFile(content){
  var boundary="conciliabanco_boundary";
  var meta={name:CONFIG_FILENAME,mimeType:"application/json"};
  var body="--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(meta)+
           "\r\n--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+content+"\r\n--"+boundary+"--";
  return fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
    {method:"POST",headers:{Authorization:"Bearer "+S.drive.token,"Content-Type":"multipart/related; boundary="+boundary},body:body})
    .then(function(r){return r.json();}).then(function(j){return j.id;});
}
function driveUpdateFile(id,content){
  return fetch("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",
    {method:"PATCH",headers:{Authorization:"Bearer "+S.drive.token,"Content-Type":"application/json"},body:content});
}
function driveLoad(){
  if(!S.drive.connected) return;
  driveFindFile().then(function(id){
    if(!id){ // no existe: crea con lo local
      driveCreateFile(JSON.stringify(S.config)).then(function(nid){ S.drive.fileId=nid; lsSet(LS_FILEID,nid); toast("Configuración creada en Drive."); });
      return;
    }
    S.drive.fileId=id; lsSet(LS_FILEID,id);
    driveReadFile(id).then(function(remote){
      if(remote && remote.empresas){
        var local=S.config;
        // fusión con prioridad a lo más reciente; unión de empresas por id, prioridad al base
        var base = (local.ts||0) >= (remote.ts||0) ? local : remote;
        var other = base===local ? remote : local;
        var map={}; (other.empresas||[]).forEach(function(e){map[e.id]=e;}); (base.empresas||[]).forEach(function(e){map[e.id]=e;});
        S.config = { empresas:Object.keys(map).map(function(k){return map[k];}), ts:Math.max(local.ts||0,remote.ts||0), clientId:S.config.clientId||DEFAULT_CLIENT_ID };
        lsSet(LS_CONFIG,S.config);
        if(base===remote) toast("Configuración cargada desde Drive.");
        else { scheduleSave(); } // lo local era más nuevo: re-sube
        render();
      }
    });
  }).catch(function(){ toast("No se pudo leer la configuración de Drive."); });
}
var saveTimer=null;
function scheduleSave(){
  S.config.ts=Date.now();
  lsSet(LS_CONFIG,S.config);
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    if(S.drive.connected){
      var content=JSON.stringify(S.config);
      var p = S.drive.fileId ? driveUpdateFile(S.drive.fileId,content) : driveCreateFile(content).then(function(id){S.drive.fileId=id;lsSet(LS_FILEID,id);});
      p.then(function(){}).catch(function(){});
    }
  },2000);
}

      +'</div></div>'
    +bulk
    +'<div class="card" style="overflow:hidden"><div class="tsc"><table><thead><tr>'
      +'<th style="width:34px"><input type="checkbox" id="chk-all"'+(allSel?" checked":"")+'></th>'
      +'<th>Fecha</th><th class="hide-m">Concepto del banco</th><th style="text-align:right">Importe</th><th class="hide-m">Tipo</th><th>Cuenta destino</th><th>Estado</th>'
      +'</tr></thead><tbody>'+rowsHTML+'</tbody></table></div></div>'
    +(S.showDat ? '<div style="margin-top:18px"><div class="row between" style="margin-bottom:6px"><span class="muted" style="font-size:12px;font-weight:600">Fichero .DAT completo · '+datName()+'</span><button class="btn btn-ink" id="btn-copiar" style="padding:5px 12px;font-size:12px">Copiar al portapapeles</button></div>'
        +'<textarea id="datfull" readonly class="pre" style="height:220px;resize:vertical">'+esc(generarDAT())+'</textarea>'
        +'<div class="muted" style="font-size:12px;margin-top:6px">Si el botón de descarga no responde en la vista previa, copia este texto y guárdalo con extensión .DAT.</div></div>'
      : '<div style="margin-top:18px"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">Vista previa del .DAT (primeras líneas)</div><pre class="pre">'+esc(generarDAT().split("\r\n").slice(0,8).join("\n"))+'</pre></div>');

  wireResultados();
  var sc2=box.querySelector(".tsc"); if(sc2&&preserveScroll) sc2.scrollTop=scroll;
  autosaveSesion();
}
function stat(label,n,color){ return '<div class="stat"><div class="muted" style="font-size:12px;margin-bottom:4px">'+esc(label)+'</div><div class="n" style="color:'+color+'">'+n+'</div></div>'; }
function seg(k,t){ return '<button data-filtro="'+k+'" class="'+(S.filtro===k?"on":"")+'">'+t+'</button>'; }

/* ================= WIRING ================= */
function wireCommon(){
  var d=el("btn-drive"); if(d) d.onclick=driveConnect;
}
function wireEmpresas(){
  wireCommon();
  document.querySelectorAll("[data-enter]").forEach(function(c){ c.onclick=function(ev){ if(ev.target.closest("[data-del]")) return; entrarEmpresa(c.getAttribute("data-enter")); }; });
  document.querySelectorAll("[data-del]").forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation(); borrarEmpresa(b.getAttribute("data-del")); }; });
  var crear=el("ne-crear"); if(crear) crear.onclick=function(){
    var n=el("ne-nombre").value.trim(), co=el("ne-codigo").value.trim();
    if(!n||!co){ toast("Pon al menos nombre y código A3."); return; }
    addEmpresa(n,co,el("ne-banco").value.trim());
  };
  var ex=el("cfg-export"); if(ex) ex.onclick=function(){ downloadText(JSON.stringify(S.config,null,2),"config_conciliabanco.json","application/json"); };
  ["ne-codigo","ne-banco"].forEach(function(id){ var i=el(id); if(i) i.oninput=function(){ i.value=i.value.replace(/\D/g,"").slice(0,id==="ne-codigo"?6:8); }; });
}
function wireTrabajo(){
  wireCommon();
  var camb=el("btn-cambiar"); if(camb) camb.onclick=function(){ S.screen="empresas"; render(); };
  var up1=document.querySelector('[data-up="up-diario"]'); if(up1) up1.onclick=cargarDiario;
  var up2=document.querySelector('[data-up="up-banco"]'); if(up2) up2.onclick=cargarBanco;
  var up3=document.querySelector('[data-up="up-plan"]'); if(up3) up3.onclick=cargarPlan;
  var con=el("btn-conciliar"); if(con) con.onclick=function(){ if(!S.facturas.length||!S.movs.length){ toast("Sube primero el Diario y el extracto."); return; } conciliar(); renderResultados(); };
  var cc=el("cfg-codigo"); if(cc) cc.oninput=function(){ cc.value=cc.value.replace(/\D/g,"").slice(0,6); updateEmpresa({codigoA3:cc.value}); };
  var cb=el("cfg-banco"); if(cb) cb.oninput=function(){ cb.value=cb.value.replace(/\D/g,"").slice(0,8); updateEmpresa({ctaBanco:cb.value}); };
  var rs=el("rec-si"); if(rs) rs.onclick=restaurarSesion;
  var rn=el("rec-no"); if(rn) rn.onclick=descartarSesion;
  var ma=el("map-apply"); if(ma) ma.onclick=aplicarMapeo;
  var mc=el("map-cancel"); if(mc) mc.onclick=function(){ S.pendingBanco=null; render(); };
}
function wireResultados(){
  document.querySelectorAll("[data-filtro]").forEach(function(b){ b.onclick=function(){ S.filtro=b.getAttribute("data-filtro"); renderResultados(); }; });
  document.querySelectorAll("[data-sel]").forEach(function(c){ c.onchange=function(){ toggleSel(+c.getAttribute("data-sel")); }; });
  document.querySelectorAll("[data-cta]").forEach(function(s){ s.onchange=function(){ setCuenta(+s.getAttribute("data-cta"),s.value); }; });
  var ca=el("chk-all"); if(ca) ca.onchange=toggleAll;
  var bc=el("bulk-cta"); if(bc) bc.onchange=function(){ S.bulkCuenta=bc.value; var ap=el("bulk-apply"); if(ap) ap.disabled=!bc.value; };
  var ba=el("bulk-apply"); if(ba) ba.onclick=applyBulk;
  var bcl=el("bulk-clear"); if(bcl) bcl.onclick=function(){ S.sel={}; renderResultados(true); };
  var vd=el("btn-verdat"); if(vd) vd.onclick=function(){ S.showDat=!S.showDat; renderResultados(true); };
  var dd=el("btn-descargar"); if(dd) dd.onclick=descargarDAT;
  var cp=el("btn-copiar"); if(cp) cp.onclick=copiarDAT;
}

/* ================= TOAST ================= */
var toastT=null;
function toast(msg){
  var t=el("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#14293d;color:#fff;padding:10px 18px;border-radius:9px;font-size:14px;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:90%"; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity="1";
  if(toastT) clearTimeout(toastT); toastT=setTimeout(function(){ t.style.opacity="0"; },2600);
}

/* ================= ARRANQUE ================= */
(function init(){
  var saved=lsGet(LS_CONFIG);
  if(saved && saved.empresas){ S.config=Object.assign({empresas:[],ts:0,clientId:DEFAULT_CLIENT_ID},saved); if(!S.config.clientId) S.config.clientId=DEFAULT_CLIENT_ID; }
  S.drive.fileId=lsGet(LS_FILEID)||null;
  render();
  // reintenta preparar Drive cuando la librería de Google haya cargado
  var tries=0; var iv=setInterval(function(){ if(driveInit()||tries++>20){ clearInterval(iv); } },400);
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
})();
</script>
