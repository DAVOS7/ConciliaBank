<style>
  :root{
    --bg:#1F2A1E;           /* fondo: verde oliva muy oscuro */
    --card:#2A3725;         /* tarjeta: oliva oscuro (se separa del fondo) */
    --surface:#3E5A3C;      /* oliva firma: barras, cabecera de tabla, botones primarios */
    --field:#232E1F;        /* campos / inputs / botones de cuenta */
    --code:#161E13;         /* panel de código (.pre) */
    --ink:#F1F6EC;          /* texto principal: crema */
    --ink-soft:#AEBFA2;     /* texto secundario: salvia apagada */
    --line:rgba(241,246,236,.13);
    --line-soft:rgba(241,246,236,.07);
    --accent:#8AAE6D;       /* salvia: acción / enlaces / detalles */
    --accent-soft:rgba(138,174,109,.18);
    --sage:#8AAE6D;
    --gold:#C2D8A6;         /* destacado claro para metadatos (salvia clara) */
    --gold-soft:rgba(138,174,109,.16);
    --match:#9BC47D; --match-soft:rgba(155,196,125,.16);
    --combo:#7FA86B; --combo-soft:rgba(127,168,107,.16);
    --pending:#D2B274; --pending-soft:rgba(210,178,116,.16);
    --manual:#93AFA6; --manual-soft:rgba(147,175,166,.15);
    --shadow:0 16px 42px rgba(0,0,0,.4);
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Karla",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 22px 90px}
  .narrow{max-width:680px}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0;color:var(--ink)}
  h1 span{color:var(--gold)}
  button{font-family:inherit;color:inherit}
  input,select,textarea{font-family:inherit}
  input:not([type=checkbox]),select,textarea{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:10px;outline:none}
  input:not([type=checkbox]):focus,select:focus,textarea:focus{border-color:var(--accent)}
  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
  ::placeholder{color:#93A487}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .between{justify-content:space-between}
  .mono{font-family:var(--mono)}
  .muted{color:var(--ink-soft)}
  .grid{display:grid;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .btn{border:none;border-radius:12px;padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:filter .15s,background .15s}
  .btn:hover{filter:brightness(1.08)}
  .btn-ink{background:var(--accent);color:#fff}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-match{background:var(--sage);color:#1F2A1E}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:rgba(31,42,30,.04);filter:none}
  .btn-link{background:transparent;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px}
  .btn-link:hover{color:var(--ink)}
  .btn:disabled{opacity:.45;cursor:default;filter:none}
  .chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;font-family:var(--sans)}
  .eyebrow{font-size:12px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .hidden{display:none!important}
  header.top{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px}
  .up{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;cursor:pointer;transition:border-color .15s,transform .15s;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  .up:hover{border-color:var(--accent);transform:translateY(-1px)}
  .up.done{background:var(--accent-soft);border-color:var(--accent)}
  .up .ic{width:38px;height:38px;border-radius:11px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:17px}
  .up.done .ic{background:var(--card);color:var(--match)}
  .up .t{font-weight:700;font-size:14px}
  .up .h{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:0;background:var(--surface);color:var(--ink-soft);text-align:left;padding:11px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;z-index:1}
  tbody td{padding:9px 12px;border-top:1px solid var(--line-soft)}

  .tsc{max-height:480px;overflow:auto;border-radius:0 0 16px 16px}

  .stat .n{font-size:30px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em}
  .seg{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
  .seg button{border:none;background:transparent;color:var(--ink-soft);border-radius:9px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}

  .pre{background:var(--code);color:#DCE6D6;padding:14px 16px;border-radius:14px;overflow:auto;font-size:11px;font-family:var(--mono);line-height:1.55;white-space:pre;border:1px solid var(--line);width:100%}
  .bar{background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 16px;border:1px solid var(--line)}
  .banner{border-radius:14px;padding:13px 16px}
  .field{display:flex;flex-direction:column;gap:5px;font-size:12px}
  .field span{color:var(--ink-soft);font-weight:600}
  .field input,.cfg input{padding:9px 11px;font-size:14px}
  .drivedot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .acct{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;max-width:240px;background:var(--field);color:var(--ink)}
  a.link{color:var(--gold)}
  ::-webkit-scrollbar{width:10px;height:10px}

    .wrap{padding:22px 16px 80px}

<script>
"use strict";

/* ================= CONSTANTES ================= */
var CTA_555 = "55500000";
var CTA_BANCO_DEF = "57200000";
var DEFAULT_CLIENT_ID = "16873040089-t63ama0nha38jr7oonlebhcfrhrcf00a.apps.googleusercontent.com";
var CONFIG_FILENAME = "config_conciliabanco.json";
var LS_CONFIG = "conciliabanco_config";
var LS_SESION = "conciliabanco_sesion";
var LS_FILEID = "conciliabanco_driveid";

/* ================= ESTADO ================= */
var S = {
  config: { empresas: [], plantillas: [], ts: 0, clientId: DEFAULT_CLIENT_ID },
  screen: "empresas",              // empresas | trabajo
  empresaId: null,
  diarioName: "", bancoName: "", planDiario: {},
  facturas: [], movs: [], resultados: [],
  filtro: "TODOS", sel: {}, bulkCuenta: "",
  showDat: false,
  pendingBanco: null,              // filas del banco a la espera de mapeo manual
  drive: { ready: false, connected: false, token: null, fileId: null }
};

/* ================= UTILIDADES ================= */
function lsGet(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function norm(s){
  return String(s==null?"":s).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function money(n){ return new Intl.NumberFormat("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n); }
function fmtDate(d){
  if(d instanceof Date && !isNaN(d)) return d.toLocaleDateString("es-ES");
  var m=String(d==null?"":d).match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[3]+"/"+m[2]+"/"+m[1];
  return String(d==null?"":d);
}
function toTime(d){
  if(d instanceof Date) return d.getTime();
  var s=String(d==null?"":d);
  var m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1]).getTime();
  var t=Date.parse(s); return isNaN(t)?0:t;
}
function toYYYYMMDD(d){
  // Fechas que ya son objeto Date (Excel las trae así cuando la celda es tipo fecha)
  if(d instanceof Date && !isNaN(d)) return ""+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  var s=String(d==null?"":d).trim();
  // Formato español: DÍA primero -> dd/mm/aaaa (o con - . y año de 2 o 4 dígitos). NUNCA usar new Date(texto): lo lee como mm/dd (americano).
  var m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){
    var dd=m[1].padStart(2,"0"), mm=m[2].padStart(2,"0"), yy=m[3];
    if(yy.length===2) yy=(parseInt(yy,10)>=70?"19":"20")+yy;
    return yy+mm+dd;
  }
  // Formato ISO aaaa-mm-dd
  var iso=s.match(/^(\d{4})[\/\-.](\d{2})[\/\-.](\d{2})/);
  if(iso) return iso[1]+iso[2]+iso[3];
  return "00000000";
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function el(id){ return document.getElementById(id); }
function readWorkbook(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(e){ try{ res(XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true})); }catch(err){ rej(err); } };
    r.onerror=function(){ rej(new Error("No se pudo leer el archivo")); };
    r.readAsArrayBuffer(file);
  });
}
function rowsOf(ws){ return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}); }

/* ================= LECTORES ================= */
function parseDiario(wb){
  var facturas=[], plan={}, hojasOK=0;
  wb.SheetNames.forEach(function(name){
    var rows=rowsOf(wb.Sheets[name]), h=-1;
    for(var i=0;i<Math.min(rows.length,20);i++){
      var line=(rows[i]||[]).map(norm);
      if(line.indexOf("CUENTA")>=0 && line.indexOf("CONCEPTO")>=0 && (line.indexOf("IMPORTE DEBE")>=0||line.indexOf("IMPORTE HABER")>=0)){ h=i; break; }
    }
    if(h<0) return;   // esta hoja no tiene cabecera de Diario; se cuenta al final
    hojasOK++;
    var H=rows[h].map(norm), c=function(n){return H.indexOf(n);};
    var ci={fecha:c("FECHA"),doc:c("DOCUMENTO"),cuenta:c("CUENTA"),desc:c("DESCRIPCION DE LA CUENTA"),debe:c("IMPORTE DEBE"),haber:c("IMPORTE HABER")};
    var fecha=null;
    for(var j=h+1;j<rows.length;j++){
      var r=rows[j]; if(!r) continue;
      if(r[ci.fecha]) fecha=r[ci.fecha];
      var cuenta=r[ci.cuenta]==null?"":String(r[ci.cuenta]).replace(/\.0$/,"").trim();
      if(!/^\d{6,8}/.test(cuenta)) continue;
      var c8=cuenta.padStart(8,"0").slice(0,8);
      if(/^(40|41|43)/.test(c8)){
        var nombre=String(r[ci.desc]==null?"":r[ci.desc]).trim();
        plan[c8]=nombre;
        var imp=Math.round(((+r[ci.debe]||0)+(+r[ci.haber]||0))*100)/100;
        if(imp>0) facturas.push({fecha:fecha,doc:String(r[ci.doc]==null?"":r[ci.doc]).trim(),cuenta:c8,nombre:nombre,importe:imp,tipo:c8.charAt(0)==="4"&&c8.charAt(1)==="3"?"COBRO":"PAGO"});
      }
    }
  });
  var seen={}, fac=[];
  facturas.forEach(function(f){ var k=f.doc+"|"+f.cuenta+"|"+f.importe; if(!seen[k]){ seen[k]=1; fac.push(f); } });
  return {facturas:fac, plan:plan, hojasOK:hojasOK, hojas:wb.SheetNames.length};
}

// Propuesta automática de cabecera y columnas para un extracto
function guessBanco(rows){
  var h=-1;
  for(var i=0;i<Math.min(rows.length,25);i++){
    var line=(rows[i]||[]).map(norm);
    if(line.indexOf("CONCEPTO")>=0 && line.indexOf("IMPORTE")>=0){ h=i; break; }
  }
  if(h<0){ for(var q=0;q<Math.min(rows.length,15);q++){ var t=(rows[q]||[]).filter(function(x){return String(x==null?"":x).trim().length>0;}); if(t.length>=3){ h=q; break; } } }
  if(h<0) h=0;
  var H=(rows[h]||[]).map(norm);
  var idx=function(cs){ for(var k=0;k<cs.length;k++){ var p=H.indexOf(cs[k]); if(p>=0) return p; } return -1; };
  return { header:h, cols:{
    fecha:idx(["FECHA OPERACION","FECHA CONTABLE","FECHA","FECHA VALOR","F OPERACION"]),
    importe:idx(["IMPORTE","IMPORTE EUR","IMPORTE MOVIMIENTO","IMPORTE (EUR)","IMPORTE OPERACION"]),
    concepto:idx(["CONCEPTO","DESCRIPCION","DESCRIPCION MOVIMIENTO","CONCEPTO COMPLETO","OBSERVACIONES","MOVIMIENTO"]),
    codigo:idx(["CODIGO","COD","CODIGO CONCEPTO"])
  }};
}
// ¿los nombres de una plantilla aparecen en este fichero?
function plantillaEncaja(t, rows){
  if(!t||!t.names) return false;
  for(var i=0;i<Math.min(rows.length,25);i++){
    var line=(rows[i]||[]).map(norm);
    if(t.names.importe && t.names.concepto && line.indexOf(norm(t.names.importe))>=0 && line.indexOf(norm(t.names.concepto))>=0) return true;
  }
  return false;
}
// Aplica una plantilla a un fichero nuevo localizando columnas por su NOMBRE (robusto a cambios de posición)
function localizarPorPlantilla(rows, t){
  var h=-1;
  for(var i=0;i<Math.min(rows.length,25);i++){
    var line=(rows[i]||[]).map(norm);
    if(t.names.importe && t.names.concepto && line.indexOf(norm(t.names.importe))>=0 && line.indexOf(norm(t.names.concepto))>=0){ h=i; break; }
  }
  if(h<0) h = (t.header!=null?t.header:0);
  var H=(rows[h]||[]).map(norm);
  function find(name,fb){ if(name){ var p=H.indexOf(norm(name)); if(p>=0) return p; } return (fb==null?-1:fb); }
  return { header:h, cols:{
    fecha:find(t.names.fecha,t.cols.fecha), importe:find(t.names.importe,t.cols.importe),
    concepto:find(t.names.concepto,t.cols.concepto), codigo:find(t.names.codigo,t.cols.codigo)
  }};
}
function nombresDe(rows, header, cols){
  var H=rows[header]||[];
  function nm(i){ return (i>=0 && H[i]!=null) ? String(H[i]).trim() : ""; }
  return { fecha:nm(cols.fecha), importe:nm(cols.importe), concepto:nm(cols.concepto), codigo:nm(cols.codigo) };
}
function extractBanco(rows, h, cols){
  var movs=[];
  for(var i=h+1;i<rows.length;i++){
    var r=rows[i]; if(!r||r[cols.importe]==null) continue;
    var raw=r[cols.importe], importe=typeof raw==="number"?raw:parseFloat(String(raw).replace(/\./g,"").replace(",","."));
    if(isNaN(importe)) continue;
    movs.push({fecha:cols.fecha>=0?r[cols.fecha]:null,concepto:String(r[cols.concepto]==null?"":r[cols.concepto]).trim(),importe:importe,codigo:cols.codigo>=0&&r[cols.codigo]!=null?String(r[cols.codigo]).replace(/\.0$/,""):""});
  }
  return movs;
}

function parsePlan(wb){
  var plan={};
  wb.SheetNames.forEach(function(name){
    var rows=rowsOf(wb.Sheets[name]), h=-1,colCta=-1,colNom=-1;
    for(var i=0;i<Math.min(rows.length,25);i++){
      var line=(rows[i]||[]).map(norm);
      var cta=line.findIndex(function(x){return ["CUENTA","CODIGO","CODIGO CUENTA","CTA","SUBCUENTA"].indexOf(x)>=0;});
      var nom=line.findIndex(function(x){return ["DESCRIPCION","TITULO","NOMBRE","DENOMINACION","DESCRIPCION DE LA CUENTA","TITULO DE LA CUENTA"].indexOf(x)>=0;});
      if(cta>=0&&nom>=0){ h=i;colCta=cta;colNom=nom;break; }
    }
    var start=h>=0?h+1:0;
    for(var j=start;j<rows.length;j++){
      var r=rows[j]; if(!r) continue;
      var cuenta="",nombre="",ni=colNom;
      if(colCta>=0){ cuenta=String(r[colCta]==null?"":r[colCta]).replace(/\.0$/,"").trim(); }
      else { var k=r.findIndex(function(x){return /^\d{6,8}$/.test(String(x==null?"":x).replace(/\.0$/,"").trim());});
             if(k>=0){ cuenta=String(r[k]).replace(/\.0$/,"").trim(); if(ni<0){ ni=r.findIndex(function(x,jj){return jj!==k && String(x==null?"":x).trim().length>3;}); } } }
      if(ni>=0) nombre=String(r[ni]==null?"":r[ni]).trim();
      if(!/^\d{6,8}$/.test(cuenta)) continue;
      var c8=cuenta.padStart(8,"0").slice(0,8);
      if(/^(40|41|43)/.test(c8) && nombre) plan[c8]=nombre;
    }
  });
  return plan;
}

/* ================= MOTOR ================= */
function planActual(){
  var e=empresa(); var pe=(e&&e.plan)||{};
  var out={}; for(var k in S.planDiario) out[k]=S.planDiario[k]; for(var k2 in pe) out[k2]=pe[k2];
  return out;
}
function identificarTercero(concepto, tipo, planEntries){
  var cn=norm(concepto), best=null, bestScore=0;
  for(var i=0;i<planEntries.length;i++){
    var cta=planEntries[i][0], nombre=planEntries[i][1];
    if(tipo==="PAGO" && !/^(40|41)/.test(cta)) continue;
    if(tipo==="COBRO" && !/^43/.test(cta)) continue;
    var words=norm(nombre).split(" ").filter(function(w){return w.length>2;});
    if(!words.length) continue;
    var hits=words.filter(function(w){return cn.indexOf(w)>=0;}).length;
    var score=hits/words.length;
    if(hits>=1 && score>=0.5 && score>bestScore){ bestScore=score; best={cuenta:cta,nombre:nombre}; }
  }
  return best;
}
function buscarFacturas(cuenta, importe, tipo, fechaMov, facturas){
  var cand=facturas.filter(function(f){return f.cuenta===cuenta && f.tipo===tipo;});
  var exact=cand.filter(function(f){return Math.abs(f.importe-importe)<0.005;});
  if(exact.length===1) return {estado:"FACTURA",docs:[exact[0].doc]};
  if(exact.length>1){ // desempate por cercanía de fecha
    var mt=toTime(fechaMov);
    exact.sort(function(a,b){return Math.abs(toTime(a.fecha)-mt)-Math.abs(toTime(b.fecha)-mt);});
    return {estado:"FACTURA",docs:[exact[0].doc]};
  }
  var imps=cand.map(function(f){return f.importe;}), docs=cand.map(function(f){return f.doc;});
  for(var n=2;n<=3;n++){
    var hits=[];
    (function rec(start,acc,sum){
      if(acc.length===n){ if(Math.abs(sum-importe)<0.005) hits.push(acc.slice()); return; }
      for(var i=start;i<imps.length;i++) rec(i+1,acc.concat([i]),sum+imps[i]);
    })(0,[],0);
    if(cand.length>40) break;
    if(hits.length===1) return {estado:"COMBINACION",docs:hits[0].map(function(i){return docs[i];})};
    if(hits.length>1) break;
  }
  return {estado:null,docs:null};
}
function conciliar(){
  var plan=planActual(), planEntries=Object.keys(plan).map(function(k){return [k,plan[k]];});
  var fac=S.facturas;
  S.resultados = S.movs.map(function(m,i){
    var importe=Math.round(Math.abs(m.importe)*100)/100;

    return {id:i,fecha:m.fecha,concepto:m.concepto,importe:importe,tipo:tipo,cuenta:cuenta,nombre:nombre,estado:estado,docs:docs};

/* ================= .DAT ================= */
function generarDAT(){
  var e=empresa(); var cfgEmp=(e&&e.codigoA3)||"", cfgBanco=(e&&e.ctaBanco)||CTA_BANCO_DEF;
  var NOM={}; NOM[CTA_555]="Partidas pendientes aplicacion"; NOM[cfgBanco]="Banco";
  function put(L,s,ini){ s=String(s); for(var i=0;i<s.length;i++) L[ini+i]=s[i]; }
  function linea(fecha,cuenta,desc,dh,iu,concepto,importe){
    var L=new Array(254); for(var z=0;z<254;z++) L[z]=" ";
    put(L,String(cfgEmp),0);   // código completo tal cual (6 dígitos, con prefijo de despacho)
    put(L,toYYYYMMDD(fecha),6);
    put(L,"0"+cuenta,14);
    put(L,String(desc).slice(0,30),27);
    put(L,dh,57);
    // Nº de asiento (58-62) EN BLANCO: A3 lo asigna al importar.
    // Cada asiento se agrupa por las marcas I (inicio) / U (último) de la posición 68,
    // que dependen del ORDEN de las líneas, no del Debe/Haber.
    put(L,iu,68);
    put(L,String(concepto).slice(0,30),69);
    var cent=Math.round(importe*100);
    put(L,"+"+String(Math.floor(cent/100)).padStart(10,"0")+"."+String(cent%100).padStart(2,"0"),99);
    put(L,"NEN",251);
    return L.join("");
  }
  var out=[];
  S.resultados.forEach(function(r){
    var descT = r.cuenta===CTA_555 ? "Partidas pendientes aplicacion" : (r.nombre||r.concepto);
    // Igual que el fichero validado: la línea del BANCO va SIEMPRE primero (I) y la contrapartida segunda (U).
    if(r.tipo==="PAGO"){
      // pago: banco al Haber, contrapartida al Debe
      out.push(linea(r.fecha,cfgBanco,"Banco","H","I",r.concepto,r.importe));
      out.push(linea(r.fecha,r.cuenta,descT,"D","U",r.concepto,r.importe));
    } else {
      // cobro: banco al Debe, contrapartida al Haber
      out.push(linea(r.fecha,cfgBanco,"Banco","D","I",r.concepto,r.importe));
      out.push(linea(r.fecha,r.cuenta,descT,"H","U",r.concepto,r.importe));
    }
  });
  return out.join("\r\n")+"\r\n";
}
function datName(){ var d=new Date(); return "SUENLACE_BANCO_"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+".DAT"; }
function downloadText(text, filename, mime){
  var bytes=new Uint8Array(text.length);
  for(var i=0;i<text.length;i++){ var c=text.charCodeAt(i); bytes[i]=c>255?63:c; }
  try{
    var url=URL.createObjectURL(new Blob([bytes],{type:mime||"application/octet-stream"}));
    var a=document.createElement("a"); a.href=url; a.download=filename; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1200);
    return true;
  }catch(e){ return false; }
}

/* ================= GOOGLE DRIVE ================= */
var tokenClient=null;
function driveInit(){
  if(!(window.google && google.accounts && google.accounts.oauth2)) return false;
  S.drive.ready=true;
  return true;
}
function driveConnect(){
  if(!driveInit()){ toast("Google aún no ha cargado. Reintenta en un momento."); return; }
  try{
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: S.config.clientId || DEFAULT_CLIENT_ID,
      scope: "https://www.googleapis.com/auth/drive.file",
      callback: function(resp){
        if(resp && resp.access_token){ S.drive.token=resp.access_token; S.drive.connected=true; render(); driveLoad(); }
        else { toast("No se pudo conectar con Google Drive."); }
      }
    });
    tokenClient.requestAccessToken({prompt:""});
  }catch(e){ toast("Error al iniciar sesión con Google."); }
}
function driveHeaders(){ return {Authorization:"Bearer "+S.drive.token}; }
function driveFindFile(){
  var q=encodeURIComponent("name='"+CONFIG_FILENAME+"' and trashed=false");
  return fetch("https://www.googleapis.com/drive/v3/files?q="+q+"&spaces=drive&fields=files(id,name,modifiedTime)",{headers:driveHeaders()})
    .then(function(r){return r.json();})
    .then(function(j){ return (j.files&&j.files[0])?j.files[0].id:null; });
}
function driveReadFile(id){
  return fetch("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media",{headers:driveHeaders()})
    .then(function(r){return r.json();});
}
function driveCreateFile(content){
  var boundary="conciliabanco_boundary";
  var meta={name:CONFIG_FILENAME,mimeType:"application/json"};
  var body="--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(meta)+
           "\r\n--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+content+"\r\n--"+boundary+"--";
  return fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
    {method:"POST",headers:{Authorization:"Bearer "+S.drive.token,"Content-Type":"multipart/related; boundary="+boundary},body:body})
    .then(function(r){return r.json();}).then(function(j){return j.id;});
}
function driveUpdateFile(id,content){
  return fetch("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",
    {method:"PATCH",headers:{Authorization:"Bearer "+S.drive.token,"Content-Type":"application/json"},body:content});
}
function driveLoad(){
  if(!S.drive.connected) return;
  driveFindFile().then(function(id){
    if(!id){ // no existe: crea con lo local
      driveCreateFile(JSON.stringify(S.config)).then(function(nid){ S.drive.fileId=nid; lsSet(LS_FILEID,nid); toast("Configuración creada en Drive."); });
      return;
    }
    S.drive.fileId=id; lsSet(LS_FILEID,id);
    driveReadFile(id).then(function(remote){
      if(remote && remote.empresas){
        var local=S.config;
        // fusión con prioridad a lo más reciente; unión de empresas por id, prioridad al base
        var base = (local.ts||0) >= (remote.ts||0) ? local : remote;
        var other = base===local ? remote : local;
        var map={}; (other.empresas||[]).forEach(function(e){map[e.id]=e;}); (base.empresas||[]).forEach(function(e){map[e.id]=e;});
        var pmap={}; (other.plantillas||[]).forEach(function(t){pmap[norm(t.banco)]=t;}); (base.plantillas||[]).forEach(function(t){pmap[norm(t.banco)]=t;});
        S.config = { empresas:Object.keys(map).map(function(k){return map[k];}), plantillas:Object.keys(pmap).map(function(k){return pmap[k];}), ts:Math.max(local.ts||0,remote.ts||0), clientId:S.config.clientId||DEFAULT_CLIENT_ID };
        lsSet(LS_CONFIG,S.config);
        if(base===remote) toast("Configuración cargada desde Drive.");
        else { scheduleSave(); } // lo local era más nuevo: re-sube
        render();
      }
    });
  }).catch(function(){ toast("No se pudo leer la configuración de Drive."); });
}
var saveTimer=null;
var saveState={dirty:false,saving:false,error:false};
function setSaveState(patch){ for(var k in patch) saveState[k]=patch[k]; pintarEstadoGuardado(); }
function scheduleSave(){
  S.config.ts=Date.now();
  lsSet(LS_CONFIG,S.config);            // el respaldo local es inmediato, nunca se pierde
  setSaveState({dirty:true,error:false});
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(flushSave,2000);
}
function flushSave(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; }
  if(!saveState.dirty) return;
  if(!S.drive.connected){ return; }     // sin Drive, queda guardado en local
  setSaveState({saving:true});
  var content=JSON.stringify(S.config);
  var p = S.drive.fileId
    ? driveUpdateFile(S.drive.fileId,content).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); })
    : driveCreateFile(content).then(function(id){ if(!id) throw new Error("sin id"); S.drive.fileId=id; lsSet(LS_FILEID,id); });
  p.then(function(){ setSaveState({dirty:false,saving:false,error:false}); })
   .catch(function(){
      setSaveState({saving:false,error:true});
      toast("No se pudo guardar la configuración en Drive. Está a salvo en este equipo; reintentando…");
      if(saveTimer) clearTimeout(saveTimer);
      saveTimer=setTimeout(flushSave,8000);   // reintento automático
   });
}
// Guardado de emergencia al cerrar/ocultar la pestaña + aviso si queda algo sin subir
function guardadoDeEmergencia(){
  if(!saveState.dirty || !S.drive.connected || !S.drive.fileId) return;
  try{
    var content=JSON.stringify(S.config);
    var url="https://www.googleapis.com/upload/drive/v3/files/"+S.drive.fileId+"?uploadType=media";
    fetch(url,{method:"PATCH",headers:{Authorization:"Bearer "+S.drive.token,"Content-Type":"application/json"},body:content,keepalive:true});
  }catch(e){}
}
window.addEventListener("visibilitychange",function(){ if(document.visibilityState==="hidden") guardadoDeEmergencia(); });
window.addEventListener("beforeunload",function(ev){
  if(saveState.dirty && S.drive.connected){
    guardadoDeEmergencia();
    ev.preventDefault(); ev.returnValue="";   // avisa antes de salir
    return "";
  }
});
function pintarEstadoGuardado(){
  var n=el("savestate"); if(!n) return;
  if(saveState.error){ n.innerHTML='<span class="drivedot" style="background:var(--pending)"></span>Sin guardar en Drive'; n.title="Guardado en este equipo. Reintentando subir a Drive."; }
  else if(saveState.saving){ n.innerHTML='<span class="drivedot" style="background:var(--accent)"></span>Guardando…'; n.title=""; }
  else if(saveState.dirty){ n.innerHTML='<span class="drivedot" style="background:var(--accent)"></span>Cambios pendientes'; n.title=""; }
  else { n.innerHTML='<span class="drivedot" style="background:var(--match)"></span>Guardado'; n.title=""; }
}

function renderMapeo(){
  var box=el("mapbox"); if(!box) return;
  if(!S.pendingBanco){ box.innerHTML=""; return; }
  var p=S.pendingBanco;
  var rows=p.sheetsData[p.names[p.sheetIdx]]||[];
  var hdr=rows[p.header]||[];
  // nº de columnas = máximo entre la cabecera y las primeras filas de datos
  var ncol=hdr.length;
  for(var z=p.header+1;z<Math.min(rows.length,p.header+6);z++){ if(rows[z]&&rows[z].length>ncol) ncol=rows[z].length; }

  function colOptions(sel, incNone){
    var o = incNone ? '<option value="-1"'+(sel<0?" selected":"")+'>— ninguna —</option>' : '';
    for(var i=0;i<ncol;i++){
      var name=hdr[i]!=null&&String(hdr[i]).trim()?String(hdr[i]).trim():("Columna "+(i+1));
      o+='<option value="'+i+'"'+(sel===i?" selected":"")+'>'+esc(name).slice(0,44)+'</option>';
    }
    return o;
  }
  function selField(id,label,val,incNone){
    return '<label class="field"><span>'+label+'</span><select id="'+id+'" class="acct" style="max-width:none">'+colOptions(val,incNone)+'</select></label>';
  }
  // opciones de plantilla
  var plist=(S.config.plantillas||[]);
  var tmplOpts='<option value="">— nueva plantilla —</option>'+plist.map(function(t,i){ return '<option value="'+i+'"'+(norm(t.banco)===norm(p.banco)?" selected":"")+'>'+esc(t.banco)+'</option>'; }).join("");
  // opciones de hoja
  var sheetSel = p.names.length>1
    ? '<label class="field"><span>Hoja</span><select id="map-sheet" class="acct" style="max-width:none">'+p.names.map(function(n,i){return '<option value="'+i+'"'+(i===p.sheetIdx?" selected":"")+'>'+esc(n)+'</option>';}).join("")+'</select></label>'
    : '';
  // opciones de fila de cabecera (primeras 15 filas con una pista de su contenido)
  var hdrOpts='';
  for(var hr=0;hr<Math.min(rows.length,15);hr++){
    var pista=(rows[hr]||[]).filter(function(x){return String(x==null?"":x).trim();}).slice(0,4).join(" · ").slice(0,50);
    hdrOpts+='<option value="'+hr+'"'+(hr===p.header?" selected":"")+'>Fila '+(hr+1)+(pista?" — "+esc(pista):"")+'</option>';
  }

  // vista previa con el mapeo actual
  var prev='';
  var showFecha=p.cols.fecha>=0, showCod=p.cols.codigo>=0;
  var count=0;
  for(var d=p.header+1; d<rows.length && count<4; d++){
    var r=rows[d]; if(!r||r[p.cols.importe]==null) continue;
    var raw=r[p.cols.importe], imp=typeof raw==="number"?raw:parseFloat(String(raw).replace(/\./g,"").replace(",","."));
    if(isNaN(imp)) continue;
    count++;
    prev+='<tr>'
      +(showFecha?'<td class="muted" style="white-space:nowrap">'+esc(fmtDate(r[p.cols.fecha]))+'</td>':'')
      +'<td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(String(r[p.cols.concepto]==null?"":r[p.cols.concepto]))+'</td>'
      +'<td class="mono" style="text-align:right;font-weight:700;color:'+(imp<0?"var(--ink)":"var(--match)")+'">'+(imp<0?"−":"+")+money(Math.abs(imp))+'</td>'
      +(showCod?'<td class="mono muted">'+esc(String(r[p.cols.codigo]==null?"":r[p.cols.codigo]).replace(/\.0$/,""))+'</td>':'')
      +'</tr>';
  }
  var prevTable = prev
    ? '<div class="muted" style="font-size:12px;font-weight:600;margin:12px 0 6px">Vista previa con estas columnas</div>'
      +'<div class="card" style="overflow:auto"><table><thead><tr>'
      +(showFecha?'<th>Fecha</th>':'')+'<th>Concepto</th><th style="text-align:right">Importe</th>'+(showCod?'<th>Código</th>':'')
      +'</tr></thead><tbody>'+prev+'</tbody></table></div>'
    : '<div class="banner" style="background:var(--pending-soft);color:var(--pending);font-size:13px;margin-top:12px">Con estas columnas no se ve ningún importe. Revisa la fila de cabecera y la columna de Importe.</div>';

  box.innerHTML='<div class="card" style="padding:16px 17px;margin-bottom:16px;border-color:var(--accent)">'
    +'<div class="row between" style="margin-bottom:4px"><div style="font-weight:700;font-size:14px">Columnas del extracto — '+esc(p.name)+'</div>'
      +'<label class="row" style="gap:8px;font-size:13px"><span class="muted">Plantilla</span><select id="map-tmpl" class="acct">'+tmplOpts+'</select></label></div>'
    +'<div class="muted" style="font-size:13px;margin-bottom:12px">Elige de qué columna sale cada dato. Puedes guardarlo como plantilla del banco para no repetirlo.</div>'
    +'<div class="grid" style="grid-template-columns:'+(p.names.length>1?'1fr 1fr':'1fr')+' 1fr;gap:12px;margin-bottom:10px">'
      +sheetSel
      +'<label class="field"><span>Fila de cabecera</span><select id="map-header" class="acct" style="max-width:none">'+hdrOpts+'</select></label>'
    +'</div>'
    +'<div class="grid" style="grid-template-columns:repeat(4,1fr);gap:12px">'
      +selField("map-fecha","Fecha",p.cols.fecha,true)
      +selField("map-importe","Importe *",p.cols.importe,false)
      +selField("map-concepto","Concepto *",p.cols.concepto,false)
      +selField("map-codigo","Código N43 (opcional)",p.cols.codigo,true)
    +'</div>'
    +prevTable
    +'<div class="row between" style="margin-top:14px;gap:12px;flex-wrap:wrap">'
      +'<label class="row" style="gap:8px;font-size:13px"><input type="checkbox" id="map-guardar"'+(p.guardar?" checked":"")+'> Guardar como plantilla del banco:</label>'
      +'<input id="map-banco" placeholder="Santander / BBVA / Bankinter…" value="'+esc(p.banco)+'" style="flex:1;min-width:160px;border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:14px">'
    +'</div>'
    +'<div class="row" style="margin-top:14px"><button class="btn btn-accent" id="map-apply">Usar estas columnas →</button><button class="btn-link" id="map-cancel">Cancelar</button></div>'
  +'</div>';
  wireMapeo();
}
function wireMapeo(){
  var p=S.pendingBanco; if(!p) return;
  function upd(){ renderMapeo(); }
  var ts=el("map-tmpl"); if(ts) ts.onchange=function(){
    var v=ts.value;
    if(v===""){ p.banco=""; p.guardar=true; }
    else { var t=S.config.plantillas[+v]; var rows=p.sheetsData[p.names[p.sheetIdx]]; var ap=localizarPorPlantilla(rows,t); p.header=ap.header; p.cols=ap.cols; p.banco=t.banco; }
    upd();
  };
  var ss=el("map-sheet"); if(ss) ss.onchange=function(){ p.sheetIdx=+ss.value; var g=guessBanco(p.sheetsData[p.names[p.sheetIdx]]); p.header=g.header; p.cols=g.cols; upd(); };
  var hh=el("map-header"); if(hh) hh.onchange=function(){ p.header=+hh.value; upd(); };
  ["fecha","importe","concepto","codigo"].forEach(function(k){
    var s=el("map-"+k); if(s) s.onchange=function(){ p.cols[k]=+s.value; upd(); };
  });
  var mg=el("map-guardar"); if(mg) mg.onchange=function(){ p.guardar=mg.checked; };
  var mb=el("map-banco"); if(mb) mb.oninput=function(){ p.banco=mb.value; };
  var ap=el("map-apply"); if(ap) ap.onclick=aplicarMapeo;
  var mc=el("map-cancel"); if(mc) mc.onclick=function(){ S.pendingBanco=null; render(); };
}

  if(!S.resultados.length){
    box.innerHTML='<div class="card" style="padding:24px 20px;border-style:dashed" class="muted">'
      +'<div class="muted" style="font-size:14px;line-height:1.6"><b style="color:var(--ink)">Cómo funciona.</b> Sube el Diario del mes y el extracto del banco. La app cruza por importe exacto: si cuadra con una factura o con la suma de varias del mismo tercero, lo concilia; si no, identifica al tercero por el concepto y lo lleva a su cuenta; y lo que no cuadra con seguridad va a la 555. Nada se da por bueno hasta que lo validas. Después descargas el .DAT para A3.</div></div>';
    return;
  }
  var scroll=0; var sc=box.querySelector(".tsc"); if(sc&&preserveScroll) scroll=sc.scrollTop;
  var nTotal=S.resultados.length, n555=S.resultados.filter(function(r){return r.cuenta===CTA_555;}).length, nOk=nTotal-n555;
  var vis=visibles(), allSel=vis.length>0&&vis.every(function(r){return S.sel[r.id];});
  var nsel=Object.keys(S.sel).length;
  var selTotal=S.resultados.filter(function(r){return S.sel[r.id];}).reduce(function(a,r){return a+r.importe;},0);
  var opts=opciones().map(function(o){return '<option value="'+o[0]+'">'+esc(o[1])+'</option>';}).join("");

  var rowsHTML=vis.map(function(r){
    var b=BADGE[r.estado]||BADGE["555"];
    return '<tr data-row="'+r.id+'" class="'+(S.sel[r.id]?"sel":"")+'">'
      +'<td style="text-align:center"><input type="checkbox" data-sel="'+r.id+'"'+(S.sel[r.id]?" checked":"")+'></td>'
      +'<td class="muted" style="white-space:nowrap">'+esc(fmtDate(r.fecha))+'</td>'
      +'<td class="hide-m" style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(r.concepto)+'">'+esc(r.concepto)+'</td>'
      +'<td class="mono" style="text-align:right;font-weight:700;color:'+(r.tipo==="COBRO"?"var(--match)":"var(--ink)")+'">'+(r.tipo==="PAGO"?"−":"+")+money(r.importe)+'</td>'
      +'<td class="muted hide-m" style="font-size:11px">'+r.tipo+'</td>'
      +'<td>'+cuentaBtnHTML(r)+'</td>'
      +'<td data-badge="'+r.id+'">'+badgeHTML(r)+'</td>'
      +'</tr>';
  }).join("");

  box.innerHTML=''
    +'<div class="grid s3" id="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">'+statsHTML()+'</div>'
    +'<div class="row between" style="margin-bottom:10px">'
      +'<div class="seg">'+seg("TODOS","Todos")+seg("CONC","Conciliados")+seg("555","A la 555")+'</div>'
      +'<div class="row" style="gap:8px">'
        +'<button class="btn btn-ghost" id="btn-verdat">'+(S.showDat?"Ocultar":"Ver / copiar")+'</button>'
        +'<button class="btn btn-accent" id="btn-descargar">⤓ Descargar .DAT</button>'
      +'</div></div>'
    +'<div id="bulkbar">'+bulkHTML()+'</div>'
    +'<div class="card" style="overflow:hidden"><div class="tsc"><table><thead><tr>'
      +'<th style="width:34px"><input type="checkbox" id="chk-all"'+(allSel?" checked":"")+'></th>'
      +'<th>Fecha</th><th class="hide-m">Concepto del banco</th><th style="text-align:right">Importe</th><th class="hide-m">Tipo</th><th>Cuenta destino</th><th>Estado</th>'
      +'</tr></thead><tbody>'+rowsHTML+'</tbody></table></div></div>'
    +(S.showDat ? '<div style="margin-top:18px"><div class="row between" style="margin-bottom:6px"><span class="muted" style="font-size:12px;font-weight:600">Fichero .DAT completo · '+datName()+'</span><button class="btn btn-ink" id="btn-copiar" style="padding:5px 12px;font-size:12px">Copiar al portapapeles</button></div>'
        +'<textarea id="datfull" readonly class="pre" style="height:220px;resize:vertical">'+esc(generarDAT())+'</textarea>'
        +'<div class="muted" style="font-size:12px;margin-top:6px">Si el botón de descarga no responde en la vista previa, copia este texto y guárdalo con extensión .DAT.</div></div>'
      : '<div style="margin-top:18px"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">Vista previa del .DAT (primeras líneas)</div><pre class="pre">'+esc(generarDAT().split("\r\n").slice(0,8).join("\n"))+'</pre></div>');

  wireResultados();
  var sc2=box.querySelector(".tsc"); if(sc2&&preserveScroll) sc2.scrollTop=scroll;
  autosaveSesion();
}
function stat(label,n,color){ return '<div class="stat"><div class="muted" style="font-size:12px;margin-bottom:4px">'+esc(label)+'</div><div class="n" style="color:'+color+'">'+n+'</div></div>'; }
function badgeHTML(r){
  var b=BADGE[r.estado]||BADGE["555"];
  return '<span class="chip" style="background:'+b.bg+';color:'+b.fg+'">'+b.t+'</span>'
       +(r.docs?' <span class="muted mono" style="font-size:11px">'+esc(r.docs.join(", "))+'</span>':'');
}
function statsHTML(){
  var nTotal=S.resultados.length, n555=0;
  for(var i=0;i<S.resultados.length;i++) if(S.resultados[i].cuenta===CTA_555) n555++;
  return stat("Movimientos",nTotal,"var(--ink)")+stat("Identificados a cuenta",nTotal-n555,"var(--match)")+stat("Pendientes en la 555",n555,"var(--pending)");
}
function bulkHTML(){
  var ids=Object.keys(S.sel); if(!ids.length) return "";
  var selTotal=0, n=0;
  for(var i=0;i<S.resultados.length;i++){ if(S.sel[S.resultados[i].id]){ selTotal+=S.resultados[i].importe; n++; } }
  var opts=opciones().map(function(o){return '<option value="'+o[0]+'"'+(o[0]===S.bulkCuenta?" selected":"")+'>'+esc(o[1])+'</option>';}).join("");
  var comunes=COMUNES.map(function(c){return '<button class="btn" data-comun="'+c.cta+'" style="background:var(--accent);color:#fff;padding:5px 10px;font-size:12px" title="'+esc(c.cta)+'">'+esc(c.lab)+'</button>';}).join("");
  return '<div class="bar" style="margin-bottom:10px">'
    +'<div class="row">'
      +'<b style="font-size:14px">'+n+' seleccionados</b>'
      +'<span class="mono" style="font-size:13px;color:var(--gold)">Σ '+money(selTotal)+' €</span>'
      +'<span style="color:var(--ink-soft)">→</span>'
      +'<select id="bulk-cta" class="acct" style="max-width:300px"><option value="">— elegir cuenta destino —</option>'+opts+'</select>'
      +'<button class="btn btn-match" id="bulk-apply" style="padding:7px 15px"'+(S.bulkCuenta?"":" disabled")+'>Conciliar a esta cuenta</button>'
      +'<button class="btn-link" id="bulk-clear" style="margin-left:auto;color:var(--ink-soft)">Quitar selección</button>'
    +'</div>'
    +'<div class="row" style="gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)">'
      +'<span style="font-size:12px;color:var(--ink-soft)">Cuentas comunes:</span>'+comunes
    +'</div>'
  +'</div>';
}
/* --- actualizaciones puntuales del DOM (sin redibujar la tabla) --- */
function wireBulk(){
  var bc=el("bulk-cta"); if(bc) bc.onchange=function(){ S.bulkCuenta=bc.value; var ap=el("bulk-apply"); if(ap) ap.disabled=!bc.value; };
  var ba=el("bulk-apply"); if(ba) ba.onclick=applyBulk;
  var bcl=el("bulk-clear"); if(bcl) bcl.onclick=limpiarSeleccion;
  document.querySelectorAll("[data-comun]").forEach(function(b){ b.onclick=function(){ aplicarCuentaSeleccion(b.getAttribute("data-comun")); }; });
}
function refrescarBulk(){
  var c=el("bulkbar"); if(!c) return;
  c.innerHTML=bulkHTML();
  wireBulk();
}
function refrescarStats(){ var s=el("stats"); if(s) s.innerHTML=statsHTML(); }
function pintarFila(id){
  var tr=document.querySelector('tr[data-row="'+id+'"]'); if(!tr) return;
  if(S.sel[id]) tr.classList.add("sel"); else tr.classList.remove("sel");
  var chk=tr.querySelector('input[data-sel]'); if(chk) chk.checked=!!S.sel[id];
}
function sincronizarChkAll(){
  var ca=el("chk-all"); if(!ca) return;
  var vis=visibles();
  ca.checked = vis.length>0 && vis.every(function(r){return S.sel[r.id];});
}
function limpiarSeleccion(){
  var ids=Object.keys(S.sel); S.sel={};
  ids.forEach(function(id){ pintarFila(id); });
  refrescarBulk(); sincronizarChkAll();
}
function seg(k,t){ return '<button data-filtro="'+k+'" class="'+(S.filtro===k?"on":"")+'">'+t+'</button>'; }

/* ================= WIRING ================= */
function wireCommon(){
  var d=el("btn-drive"); if(d) d.onclick=driveConnect;
  pintarEstadoGuardado();
}
function wireEmpresas(){
  wireCommon();
  document.querySelectorAll("[data-enter]").forEach(function(c){ c.onclick=function(ev){ if(ev.target.closest("[data-del]")) return; entrarEmpresa(c.getAttribute("data-enter")); }; });
  document.querySelectorAll("[data-del]").forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation(); borrarEmpresa(b.getAttribute("data-del")); }; });
  var crear=el("ne-crear"); if(crear) crear.onclick=function(){
    var n=el("ne-nombre").value.trim(), co=el("ne-codigo").value.trim();
    if(!n||!co){ toast("Pon al menos nombre y código A3."); return; }
    var bancos=[]; document.querySelectorAll(".ne-bch").forEach(function(c){ if(c.checked) bancos.push(c.value); });
    addEmpresa(n,co,el("ne-banco").value.trim(),bancos);
  };
  var ex=el("cfg-export"); if(ex) ex.onclick=function(){ downloadText(JSON.stringify(S.config,null,2),"config_conciliabanco.json","application/json"); };
  ["ne-codigo","ne-banco"].forEach(function(id){ var i=el(id); if(i) i.oninput=function(){ i.value=i.value.replace(/\D/g,"").slice(0,id==="ne-codigo"?6:8); }; });
  var ba=el("banco-add"); if(ba) ba.onclick=function(){ cargarBanco("biblioteca"); };
  document.querySelectorAll("[data-delbanco]").forEach(function(b){ b.onclick=function(){ borrarPlantilla(+b.getAttribute("data-delbanco")); }; });
  renderMapeo();
}
function wireTrabajo(){
  wireCommon();
  var camb=el("btn-cambiar"); if(camb) camb.onclick=function(){ S.screen="empresas"; render(); };
  var up1=document.querySelector('[data-up="up-diario"]'); if(up1) up1.onclick=cargarDiario;
  var up2=document.querySelector('[data-up="up-banco"]'); if(up2) up2.onclick=function(){ cargarBanco("trabajo"); };
  var up3=document.querySelector('[data-up="up-plan"]'); if(up3) up3.onclick=cargarPlan;
  var con=el("btn-conciliar"); if(con) con.onclick=function(){ if(!S.facturas.length||!S.movs.length){ toast("Sube primero el Diario y el extracto."); return; } conciliar(); renderResultados(); };
  var cc=el("cfg-codigo"); if(cc) cc.oninput=function(){ cc.value=cc.value.replace(/\D/g,"").slice(0,6); updateEmpresa({codigoA3:cc.value}); };
  var cb=el("cfg-banco"); if(cb) cb.oninput=function(){ cb.value=cb.value.replace(/\D/g,"").slice(0,8); updateEmpresa({ctaBanco:cb.value}); };
  var rs=el("rec-si"); if(rs) rs.onclick=restaurarSesion;
  var rn=el("rec-no"); if(rn) rn.onclick=descartarSesion;
  wireBancosEmpresa();
}
function wireResultados(){
  document.querySelectorAll("[data-filtro]").forEach(function(b){ b.onclick=function(){ S.filtro=b.getAttribute("data-filtro"); renderResultados(); }; });
  document.querySelectorAll("[data-sel]").forEach(function(c){ c.onchange=function(){ toggleSel(+c.getAttribute("data-sel")); }; });
  document.querySelectorAll("[data-pick]").forEach(function(b){ b.onclick=function(){ abrirPicker(b.getAttribute("data-pick")); }; });
  var ca=el("chk-all"); if(ca) ca.onchange=toggleAll;
  wireBulk();
  var vd=el("btn-verdat"); if(vd) vd.onclick=function(){ S.showDat=!S.showDat; renderResultados(true); };
  var dd=el("btn-descargar"); if(dd) dd.onclick=descargarDAT;
  var cp=el("btn-copiar"); if(cp) cp.onclick=copiarDAT;
}

/* ================= TOAST ================= */
var toastT=null;
function toast(msg){
  var t=el("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--surface);color:var(--ink);padding:11px 18px;border-radius:12px;border:1px solid var(--line);font-size:14px;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:90%"; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity="1";
  if(toastT) clearTimeout(toastT); toastT=setTimeout(function(){ t.style.opacity="0"; },2600);
}

/* ================= ARRANQUE ================= */
(function init(){
  var saved=lsGet(LS_CONFIG);
  if(saved && saved.empresas){ S.config=Object.assign({empresas:[],plantillas:[],ts:0,clientId:DEFAULT_CLIENT_ID},saved); if(!S.config.clientId) S.config.clientId=DEFAULT_CLIENT_ID; if(!S.config.plantillas) S.config.plantillas=[]; }
  S.drive.fileId=lsGet(LS_FILEID)||null;
  render();
  // reintenta preparar Drive cuando la librería de Google haya cargado
  var tries=0; var iv=setInterval(function(){ if(driveInit()||tries++>20){ clearInterval(iv); } },400);
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.addEventListener("updatefound",function(){
        var nw=reg.installing; if(!nw) return;
        nw.addEventListener("statechange",function(){
          if(nw.state==="installed" && navigator.serviceWorker.controller){
            toast("Hay una versión nueva de la app. Recárgala para actualizar.");
          }
        });
      });
    }).catch(function(){});
  }
})();
</script>
